services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: symbio
      POSTGRES_PASSWORD: symbio_local
      POSTGRES_DB: symbiochain
    ports: ['127.0.0.1:55439:5432']
    volumes: ['symbio_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U symbio -d symbiochain']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  symbio_pg:
