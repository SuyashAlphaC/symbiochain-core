name: Backend and contract verification
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symbio
          POSTGRES_PASSWORD: symbio_ci
          POSTGRES_DB: symbiochain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://symbio:symbio_ci@localhost:5432/symbiochain_test
      TEST_DATABASE_URL: postgresql://symbio:symbio_ci@localhost:5432/symbiochain_test
      EXECUTION_MODE: PAPER
      ADMIN_TOKEN: ci-admin-token-nonsecret-0000000000000000
      READ_TOKEN: ci-read-token-nonsecret-00000000000000000
      EVIDENCE_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci --prefix .railway --ignore-scripts
      - run: npm run infra:check
      - run: npm run db:migrate
      - run: npm run check
      - name: Validate owner deployment manifest and browser bundle
        run: |
          npm ci --prefix tools/mainnet-deploy
          node --test tools/mainnet-deploy/*.test.mjs
          npm run build --prefix tools/mainnet-deploy
          npm audit --prefix tools/mainnet-deploy --audit-level=high
      - name: Build release image
        run: docker build -t symbiochain-core:ci .
      - name: Verify packaged rehearsal and quarantine evidence
        run: |
          docker run --rm --entrypoint node symbiochain-core:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { readdir, readFile } from "node:fs/promises";
            import { readTestnetReport } from "./dist/testnet-report.js";
            import { readMainnetOwnedExecution } from "./dist/mainnet-execution.js";
            import { readMainnetProvisioning } from "./dist/mainnet-provisioning.js";
            import { readMainnetSettlementFixture } from "./dist/mainnet-settlement.js";
            const report = await readTestnetReport();
            assert.ok(report.runId);
            assert.equal(report.profile, "TESTNET_REHEARSAL");
            assert.deepEqual((await readdir("artifacts")).sort(), ["brave-cli-verification.json", "mainnet-acceptance.json", "mainnet-bounded-activation.json", "mainnet-intents-settlement.json", "mainnet-owned-execution.json", "mainnet-paused-deployment.json", "mainnet-wallet-provisioning.json", "testnet-rehearsal.json"]);
            const audit = JSON.parse(await readFile("artifacts/brave-cli-verification.json", "utf8"));
            assert.equal(audit.deploymentApproved, false);
            assert.equal(audit.signedModelResponseVerified, false);
            assert.equal(audit.paidInferenceRequests, 0);
            const settlement = await readMainnetSettlementFixture();
            assert.equal(settlement.payments.length, 2);
            assert.equal(settlement.teeApprovalClaimed, false);
            assert.equal(settlement.externalRevenueProven, false);
            assert.equal((await readMainnetProvisioning()).status, "PARTIAL_REFUNDED");
            assert.equal((await readMainnetOwnedExecution()).results.length, 2);
          '
      - run: npm run db:harden
      # Integration fixtures deliberately leave pending recovery jobs in this isolated database.
      - run: npm run demo
      - run: npm run test:integration
      - run: npm audit --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: rustup show
      - run: npm run contract:test
      - run: npm run contract:build
      - run: bash scripts/build-mock.sh
      - run: bash scripts/install-sandbox.sh
      - run: npm run contract:integration
