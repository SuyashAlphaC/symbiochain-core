[package]
name = "symbiochain-treasury"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.27.0", features = ["legacy"] }
near-contract-standards = "=5.27.0"
borsh = "1.5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
